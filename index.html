<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guitar Fretboard Trainer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%234adf8e%22/><text x=%2250%22 y=%2250%22 font-size=%2260%22 font-family=%22sans-serif%22 font-weight=%22bold%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23121212%22>G</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="tab-nav">
            <button class="tab-btn" data-tab="fretboard-tab-content">Fretboard</button>
            <button class="tab-btn" data-tab="numbers-tab-content">Numbers</button>
        </div>

        <div id="app-body">
            <div id="fretboard-tab-content" class="tab-content">
                <div>
                    <div id="display-container">
                        <div class="display-wrapper">
                            <h3 class="display-header">String</h3>
                            <div class="display" id="string-display">--</div>
                        </div>
                        <div class="display-wrapper">
                            <h3 class="display-header">Note</h3>
                            <div class="display" id="note-display">--</div>
                        </div>
                    </div>
                    <div id="answer-display-container">
                        <div class="display-wrapper">
                            <h3 class="display-header">Fret</h3>
                            <div class="display" id="answer-fret-display">--</div>
                        </div>
                    </div>
                </div>
                <div class="options-divider"></div>
                <div class="fretboard-controls-row">
                    <div class="control-group">
                        <label for="note-type-selector">Note Type</label>
                        <select id="note-type-selector">
                            <option value="naturals">Naturals</option>
                            <option value="sharps">Sharps</option>
                            <option value="flats">Flats</option>
                            <option value="all">All</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="inst-type-selector">Inst. Type</label>
                        <select id="inst-type-selector">
                            <option value="guitar" selected>Guitar</option>
                            <option value="bass">Bass</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="numbers-tab-content" class="tab-content">
                <div id="numbers-game-area">
                    <div class="display-wrapper">
                        <h3 class="display-header">Current Number</h3>
                        <div class="display" id="current-number-display">--</div>
                    </div>
                    <div id="answer-display-container">
                        <div class="display-wrapper">
                            <h3 class="display-header">Number</h3>
                            <div class="display" id="answer-number-display">--</div>
                        </div>
                        <div class="display-wrapper">
                            <h3 class="display-header">Chord</h3>
                            <div class="display" id="answer-chord-display">--</div>
                        </div>
                    </div>
                </div>
                <div class="options-divider"></div>
                <div class="control-group">
                    <div class="numbers-options-container">
                        <div class="label-wrapper">
                            <div class="label-with-icon">
                                <label for="key-selector">Key</label>
                                <button id="open-cheat-sheet-btn" class="link-button" title="Open Nashville Number Cheat Sheet">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" style="width: 20px; height: 20px;">
                                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                            <select id="key-selector">
                                <option>C</option>
                                <option>G</option>
                                <option>D</option>
                                <option>A</option>
                                <option>E</option>
                                <option>B</option>
                                <option>F#</option>
                                <option>Gb</option>
                                <option>Db</option>
                                <option>Ab</option>
                                <option>Eb</option>
                                <option>Bb</option>
                                <option>F</option>
                            </select>
                        </div>
                        <div class="label-wrapper">
                            <label for="easy-mode-switch" class="switch-label">Easy</label>
                            <label class="switch">
                                <input type="checkbox" id="easy-mode-switch">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="global-controls">
            <div id="compact-controls">
                <div id="metronome">
                    <div class="beat-dot" id="beat-1"><span class="accent-caret">^</span></div>
                    <div class="beat-dot" id="beat-2"></div>
                    <div class="beat-dot" id="beat-3"></div>
                    <div class="beat-dot" id="beat-4"></div>
                </div>
                <div class="compact-display">
                    <div id="bpm-display">
                        <span id="tempo-value">120</span> BPM
                    </div>
                    <div id="timer-compact-display" class="hidden">
                        <span id="timer-display">00:00</span>
                    </div>
                </div>
                <button id="expand-controls-btn" class="icon-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M7.646 4.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 5.707l-5.646 5.647a.5.5 0 0 1-.708-.708z"/></svg>
                </button>
            </div>
            <div id="full-controls">
                <div class="control-group">
                    <label for="tempo-slider">Tempo</label>
                    <input type="range" id="tempo-slider" min="40" max="240" value="120">
                </div>
                <div class="control-group timer-controls">
                    <div class="timer-toggle-group">
                        <label class="switch-label" for="timer-enable-switch">Timer</label>
                        <label class="switch">
                            <input type="checkbox" id="timer-enable-switch">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="timer-duration-group">
                        <div class="timer-inputs">
                            <input type="number" id="timer-minutes-input" min="0" max="60" value="5" inputmode="numeric">
                            <span>min</span>
                            <input type="number" id="timer-seconds-input" min="0" max="59" value="0" inputmode="numeric">
                            <span>sec</span>
                        </div>
                        <button id="reset-timer-btn" class="control-btn" disabled>Reset</button>
                    </div>
                </div>
            </div>
        </div>
        <button id="start-stop-btn">Start</button>

        <div id="cheat-sheet-overlay" class="overlay hidden">
            <div class="overlay-content">
                <button id="close-overlay-btn" class="close-btn">&times;</button>
                <h2>Nashville Numbers</h2>
                <div class="control-group">
                    <label for="cheat-sheet-key-selector">Key</label>
                    <select id="cheat-sheet-key-selector">
                        <option value="C">C</option>
                        <option value="Db">Db</option>
                        <option value="D">D</option>
                        <option value="Eb">Eb</option>
                        <option value="E">E</option>
                        <option value="F">F</option>
                        <option value="F#">F#</option>
                        <option value="G">G</option>
                        <option value="Ab">Ab</option>
                        <option value="A">A</option>
                        <option value="Bb">Bb</option>
                        <option value="B">B</option>
                    </select>
                </div>
                <ul id="cheat-sheet-list"></ul>
            </div>
        </div>

        <div id="timer-complete-overlay" class="overlay hidden">
            <div class="overlay-content">
                <button id="close-timer-complete-btn" class="close-btn">&times;</button>
                <h2>Timer Completed!</h2>
                <p>Your practice session has ended.</p>
                <button id="ok-timer-complete-btn" class="control-btn">OK</button>
            </div>
        </div>
    </div>

    <script src="script.js" type="module"></script>
</body>
</html>
